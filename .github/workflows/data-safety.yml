name: Data Safety Gate

on:
  push:
  pull_request:

concurrency:
  group: data-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Block real data and secret-like artifacts
        run: python scripts/check_repository_hygiene.py
      - name: Validate repository governance contract
        run: |
          python scripts/check_governance_contract.py
          python -m unittest discover -s tests -p 'test_governance_contract.py' -v

  backup-restore-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run backup/restore E2E
        run: python -m unittest discover -s tests -p 'test_backup_restore_e2e.py' -v

  sqlite-postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: reqsys_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reqsys_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Run SQLite to PostgreSQL E2E
        env:
          POSTGRES_DSN: postgresql://postgres:ci@127.0.0.1:5432/reqsys_data_test
        run: python -m unittest discover -s tests -p 'test_sqlite_to_postgres_e2e.py' -v

  data-quality-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run data quality E2E
        run: python -m unittest discover -s tests -p 'test_data_quality_e2e.py' -v

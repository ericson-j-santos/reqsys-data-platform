name: Data Safety Gate

on:
  push:
  pull_request:

concurrency:
  group: data-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block real data and secret-like artifacts
        run: python scripts/check_repository_hygiene.py

  backup-restore-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backup/restore E2E
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_backup_restore_e2e.py' -v

  sqlite-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SQLite schema analyzer tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_sqlite_schema_contract.py' -v

  sqlite-postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: reqsys_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reqsys_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_DSN: postgresql://postgres:ci@127.0.0.1:5432/reqsys_data_test
    steps:
      - uses: actions/checkout@v4

      - name: Install data-platform test dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Run SQLite to PostgreSQL E2E suite
        run: |
          python -m unittest discover -s tests -p 'test_sqlite_to_postgres_e2e.py' -v
          python -m unittest discover -s tests -p 'test_reqsys_contract_migration_e2e.py' -v

      - name: Resolve pinned ReqSys product SHA
        id: product
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          contract=json.loads(Path("contracts/reqsys-product-schema-source.json").read_text())
          print(f"sha={contract['source_sha']}")
          print(f"repository={contract['source_repository']}")
          PY

      - name: Checkout pinned ReqSys product
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.product.outputs.repository }}
          ref: ${{ steps.product.outputs.sha }}
          path: .product/reqsys
          persist-credentials: false

      - name: Install pinned ReqSys backend dependencies
        run: python -m pip install -r .product/reqsys/backend/requirements.txt

      - name: Materialize current ReqSys Base metadata as SQLite
        run: |
          python scripts/materialize_reqsys_product_schema.py             --product-root .product/reqsys             --output /tmp/reqsys-product-schema.sqlite

      - name: Analyze actual generated ReqSys SQLite schema
        run: |
          python migrations/sqlite_schema_contract.py             --source /tmp/reqsys-product-schema.sqlite             --require-supported             --json /tmp/reqsys-product-schema-report.json

      - name: Migrate and independently verify full ReqSys schema
        env:
          REQSYS_PRODUCT_SCHEMA_DB: /tmp/reqsys-product-schema.sqlite
        run: python -m unittest -v tests/test_reqsys_product_schema_contract_e2e.py

      - name: Materialize canonical ReqSys PostgreSQL schema
        run: |
          python scripts/materialize_reqsys_product_postgres_schema.py \
            --product-root .product/reqsys \
            --schema reqsys_product_expected

      - name: Materialize migrated PostgreSQL schema for parity
        run: |
          python migrations/sqlite_to_postgres.py \
            --source /tmp/reqsys-product-schema.sqlite \
            --schema reqsys_product_migrated \
            --correlation-id "parity-${GITHUB_SHA}" \
            --environment ci

      - name: Compare migration schema with canonical product PostgreSQL schema
        env:
          REQSYS_MIGRATED_SCHEMA: reqsys_product_migrated
          REQSYS_EXPECTED_SCHEMA: reqsys_product_expected
        run: python -m unittest -v tests/test_reqsys_product_postgres_parity_e2e.py
